services:

  mesh-dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    restart: unless-stopped
    container_name: mesh-dragonfly-selfhosted # Override the default name, as Docker adds index to the default name (eg. portal-redis-e2e-1) 
    ulimits:
      memlock: -1
    # Don't use all threads, occasionally fails with "There are 20 threads, so 5.00GiB are required. Exiting..."
    command: dragonfly --proactor_threads=3
    ports:
      - "6381:6379"
    # For better performance, consider `host` mode instead `port` to avoid docker NAT.
    # `host` mode is NOT currently supported in Swarm Mode.
    # https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
    # network_mode: "host"
    volumes:
      - dragonflymeshdata:/data

  mesh-postgres:
    image: postgres:18.6-alpine
    restart: always
    container_name: mesh-postgres-selfhosted
    environment:
      POSTGRES_USER: ${MESH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MESH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MESH_POSTGRES_DB}
    # ports:
    #   - "5434:5432"
    volumes:
      - pg-data-mesh:/var/lib/postgresql
    networks:
      - private-mesh-network

  mesh-server:
    image: rujorgensen/persistica-mesh:latest
    restart: unless-stopped
    container_name: mesh-server-selfhosted
    ports:
      - "6350:6379"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5100/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - private-mesh-network

  portal:
    image: rujorgensen/persistica-portal:latest
    restart: unless-stopped
    container_name: portal-server-selfhosted
    ports:
      - "6350:6379"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - private-mesh-network

networks:
  private-mesh-network:
    driver: bridge

volumes:
  dragonflymeshdata:
  pg-data-mesh:
