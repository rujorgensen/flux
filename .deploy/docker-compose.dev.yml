services:
  mesh-dragonfly-dev-NOT_USED:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: mesh-dragonfly-dev # Override the default name, as Docker adds index to the default name (eg. portal-redis-e2e-1) 
    ulimits:
      memlock: -1
    ports:
      - "6399:6379"
    # For better performance, consider `host` mode instead `port` to avoid docker NAT.
    # `host` mode is NOT currently supported in Swarm Mode.
    # https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
    # network_mode: "host"
    volumes:
      - dragonflymeshdata:/mesh-dev-data

  # Dragonfly does not work with "await this._client.send('HEXPIRE', [key, '60', 'FIELDS', '1', 'locked',]);"
  mesh-redis-dev:
    image: redis:7.4.3
    # command: redis-server --requirepass e2e-redis-password
    restart: always
    container_name: mesh-redis-dev # Override the default name, as Docker adds index to the default name (eg. portal-redis-e2e-1) 
    ports:
      - 6381:6379

  #portal-dragonfly-dev:
  #  image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
  #  container_name: portal-dragonfly-dev # Override the default name, as Docker adds index to the default name (eg. portal-redis-e2e-1) 
  #  ulimits:
  #    memlock: -1
  #  ports:
  #    - "6350:6379"
  #  # For better performance, consider `host` mode instead `port` to avoid docker NAT.
  #  # `host` mode is NOT currently supported in Swarm Mode.
  #  # https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
  #  # network_mode: "host"
  #  volumes:
  #    - dragonflyportaldata:/portal-dev-data
  portal-redis-dev:
    image: redis:7.4.3
    command: redis-server --requirepass e2e-redis-password
    restart: always
    container_name: portal-redis-dev # Override the default name, as Docker adds index to the default name (eg. portal-redis-e2e-1) 
    ports:
      - 6350:6379

