services:
  portal-ui:
    image: persitica-portal-ui:latest
    container_name: portal-ui-prod
    build:
      context: .
      dockerfile: ./apps/frontend/portal/Dockerfile
      target: deploy
    networks:
      - portal-public-network

  portal-api:
    image: persitica-portal-api:latest
    container_name: portal-api-prod
    environment:
      FLUX_DATABASE_URL: ${FLUX_DATABASE_URL}
    build:
      context: .
      dockerfile: ./apps/backend/portal/Dockerfile
      target: deploy
      args:
        FLUX_DATABASE_URL: ${FLUX_DATABASE_URL}
    networks:
      - portal-public-network

  # ******************************************************************************
  # *** Proxy
  # ******************************************************************************
  caddy:
    image: caddy:2.10.2
    container_name: portal-caddy-proxy-prod
    restart: unless-stopped
    ports:
      - "9000:9000"
    #    - "80:80"
    #    - "443:443"
    #    - "443:443/udp"

    depends_on:
      portal-api:
        condition: service_started
      portal-ui:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portal-public-network

# *******************************************************************************
# *** Networks
# *******************************************************************************
networks:
  portal-public-network:
    driver: bridge

# *******************************************************************************
# *** Volumes
# *******************************************************************************
volumes:
  caddy_data:
  caddy_config:
