<app-dashboard-layout [userSession]="userSession()">
    <div class="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center">
        <!-- Icon -->
        <div class="relative mb-8">
            <div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    class="w-12 h-12 stroke-primary"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M13 10V3L4 14h7v7l9-11h-7z"
                    ></path>
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-base-content mb-3">No Network Selected</h1>

        <!-- Description -->
        <p class="text-base-content/60 max-w-md mb-2 text-base leading-relaxed">
            You need a Flux network to access the dashboard.
            Use the <span class="font-medium text-base-content/80">network selector</span> in the sidebar to create or select one.
        </p>
        <p class="text-sm text-base-content/40 mb-8">
            You can create up to 3 networks per account.
        </p>

        <!-- Hint arrow pointing to sidebar -->
        <div class="flex items-center gap-2 text-sm text-primary font-medium">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                class="w-4 h-4 stroke-current"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10 19l-7-7m0 0l7-7m-7 7h18"
                ></path>
            </svg>
            Open the sidebar to get started
        </div>
    </div>
</app-dashboard-layout>
