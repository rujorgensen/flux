@if (dataStore(); as data) {
    @if (data.length > 0) {
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>UID</th>
                    <th>IP</th>
                    <th>address</th>
                    <th>bytes</th>
                    <th>Connected At</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (row of data; track row.id) {
                    <tr>
                        <td>{{ row.id }}</td>
                        <td>{{ row.uid }}</td>
                        <td>{{ row.ip }}</td>
                        <td>{{ row.address }}</td>
                        <td>{{ row.bytes }}</td>
                        <td>{{ row.connectedAt | date:'fullDate' }}</td>
                        <td>
                            <button
                                class="btn btn-ghost btn-sm text-error"
                                [disabled]="kickingAgentId() === row.id"
                                (click)="onKickAgent(row)"
                                [attr.aria-label]="'Kick agent ' + row.id"
                                title="Kick agent"
                            >
                                @if (kickingAgentId() === row.id) {
                                    <span class="loading loading-spinner loading-xs"></span>
                                } @else {
                                    Kick
                                }
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    } @else {
        <div class="flex flex-col items-center justify-center py-16 text-base-content/50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-12 h-12 stroke-current mb-3" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span class="text-sm font-medium">No connected agents</span>
        </div>
    }
}
