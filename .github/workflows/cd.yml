name: "Deploy mesh to Docker hub"

on:
  workflow_dispatch: {}
  push:
    branches: 
      - main

env:
  IMAGE_TAG: 1.0${{ github.run_number }}
  is-main-branch: ${{ github.ref == 'refs/heads/main' }}
  is-pull-request: ${{ github.event_name == 'pull_request' }}

jobs:

  mesh-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      -
          name: Checkout
          uses: actions/checkout@v4

      -
          name: Extract version
          id: package-version
          uses: martinbeentjes/npm-get-version-action@main

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: 🗝️ Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      -
        name: Build and push to Docker hub
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./apps/backend/mesh/Dockerfile
          target: deploy
          tags: |
              ${{ secrets.DOCKER_HUB_USERNAME }}/persistica-mesh:staging-${{ steps.package-version.outputs.current-version }}
              ${{ secrets.DOCKER_HUB_USERNAME }}/persistica-mesh:latest
