name: Release packages to npm

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'persistica-flux-agent@*'
      - 'persistica-flux-authority@*'
      - 'persistica-flux-mesh@*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rujorgensen/flux' && startsWith(github.ref_name, matrix.tag_prefix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: persistica-flux-agent
            package_dir: packages/flux/agent
            package_name: '@persistica/flux-agent'
            publish_script: publish:agent
            tag_prefix: persistica-flux-agent@
          - project: persistica-flux-authority
            package_dir: packages/flux/authority
            package_name: '@persistica/flux-authority'
            publish_script: publish:authority
            tag_prefix: persistica-flux-authority@
          - project: persistica-flux-mesh
            package_dir: packages/flux/mesh
            package_name: '@persistica/flux-mesh'
            publish_script: publish:mesh
            tag_prefix: persistica-flux-mesh@

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate tag version
        id: version-check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#${{ matrix.tag_prefix }}}"
          PACKAGE_VERSION=$(bun -e "const pkg = await Bun.file('./${{ matrix.package_dir }}/package.json').json(); console.log(pkg.version)")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' does not match ${{ matrix.package_name }} package version '$PACKAGE_VERSION'"
            exit 1
          fi

          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "${{ steps.version-check.outputs.package_version }}" == *"-alpha"* ]] || [[ "${{ steps.version-check.outputs.package_version }}" == *"-beta"* ]] || [[ "${{ steps.version-check.outputs.package_version }}" == *"-rc"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: bunx nx run ${{ matrix.project }}:build

      - name: Publish package
        run: bun run ${{ matrix.publish_script }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_TAG: ${{ steps.npm-tag.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "## npm release complete 🚀"
            echo
            echo "- **Package:** ${{ matrix.package_name }}"
            echo "- **Version tag:** ${{ github.ref_name }}"
            echo "- **Version:** ${{ steps.version-check.outputs.package_version }}"
            echo "- **npm tag:** ${{ steps.npm-tag.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
