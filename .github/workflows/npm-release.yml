name: Release packages to npm

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'persistica-flux-agent@*'
      - 'persistica-flux-authority@*'
      - 'persistica-flux-mesh@*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rujorgensen/flux'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve release package
        id: package
        run: |
          case "${GITHUB_REF_NAME}" in
            persistica-flux-agent@*)
              echo "project=persistica-flux-agent" >> "$GITHUB_OUTPUT"
              echo "package_name=@persistica/flux-agent" >> "$GITHUB_OUTPUT"
              echo "package_file=packages/flux/agent/package.json" >> "$GITHUB_OUTPUT"
              echo "publish_script=publish:agent" >> "$GITHUB_OUTPUT"
              ;;
            persistica-flux-authority@*)
              echo "project=persistica-flux-authority" >> "$GITHUB_OUTPUT"
              echo "package_name=@persistica/flux-authority" >> "$GITHUB_OUTPUT"
              echo "package_file=packages/flux/authority/package.json" >> "$GITHUB_OUTPUT"
              echo "publish_script=publish:authority" >> "$GITHUB_OUTPUT"
              ;;
            persistica-flux-mesh@*)
              echo "project=persistica-flux-mesh" >> "$GITHUB_OUTPUT"
              echo "package_name=@persistica/flux-mesh" >> "$GITHUB_OUTPUT"
              echo "package_file=packages/flux/mesh/package.json" >> "$GITHUB_OUTPUT"
              echo "publish_script=publish:mesh" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#*@}"
          PACKAGE_VERSION=$(bun -e "const pkg = await Bun.file('./${{ steps.package.outputs.package_file }}').json(); console.log(pkg.version)")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' does not match ${{ steps.package.outputs.package_name }} package version '$PACKAGE_VERSION'"
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *"-alpha"* ]] || [[ "${{ steps.version.outputs.version }}" == *"-beta"* ]] || [[ "${{ steps.version.outputs.version }}" == *"-rc"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: bunx nx run ${{ steps.package.outputs.project }}:build

      - name: Publish to npm
        run: bun run ${{ steps.package.outputs.publish_script }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_TAG: ${{ steps.npm-tag.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "## Release complete 🚀"
            echo
            echo "- **Package:** ${{ steps.package.outputs.package_name }}"
            echo "- **Version:** ${{ steps.version.outputs.version }}"
            echo "- **Tag:** ${{ github.ref_name }}"
            echo "- **npm tag:** ${{ steps.npm-tag.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
