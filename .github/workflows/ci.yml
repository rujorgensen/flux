# .github/workflows/e2e.yml
name: Run test suites

on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - '**'
  #     - '!wip/**'

  pull_request:

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

env:
  is-main-branch: ${{ github.ref == 'refs/heads/main' }}
  is-pull-request: ${{ github.event_name == 'pull_request' }}
  sha: ${{ github.sha }}
  BUN_TEST_DISABLE_ANSI: '1'
  NX_BATCH_MODE: true
  CI: true
  FLUX_DATABASE_URL: 'redis://:non-important-dev-redis-password@localhost:1234'

jobs:
  install-deps:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@v6
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      -
        name: 💾 Cache Prisma types
        uses: actions/cache@v6
        id: prisma-cache
        with:
          path: |
            @prisma-types
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}

      -
        name: 💾 Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      -
        name: 🔧 Generate Prisma types
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: bun prisma:generate:portal

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5
        with:
          # Gitea Actions doesn't expose the workflow id the way GitHub's API does, so the
          # action resolves it to 'undefined' and exits 1. Naming the file explicitly works
          # on both forges -- GitHub derives the same value on its own.
          workflow-id: ci.yml

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 💾 Restore cached dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: 💾 Restore Prisma types
        uses: actions/cache@v6
        with:
          path: |
            @prisma-types
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bun nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected

      # Force oxlint to use the bun runtime rather than NodeJS
      - run: bunx --bun oxlint --quiet --format=github

      - name: 🧪 Run unit tests
        timeout-minutes: 2
        run: bun nx affected -t bun-test test lint # --no-agents

  e2e-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5
        with:
          workflow-id: ci.yml # Same reason as above.

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 💾 Restore cached dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: 💾 Restore Prisma types
        uses: actions/cache@v6
        with:
          path: |
            @prisma-types
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bun nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected

      - name: 💾 Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: 🧪 Run E2E tests
        timeout-minutes: 2
        run: bun nx affected:e2e --output-style=stream --verbose --timeout=30000 # --no-agents

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0    # 👈 Required to retrieve git history

      - uses: nrwl/nx-set-shas@v5
        with:
          workflow-id: ci.yml # Same reason as above.

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 💾 Restore cached dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: 💾 Restore Prisma types
        uses: actions/cache@v6
        with:
          path: |
            @prisma-types
          key: ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-${{ hashFiles('prisma/schema.prisma') }}

      - name: 🛠️ Build
        timeout-minutes: 2
        # Demo does not currently build
        run: bun nx affected -t build --exclude demo
