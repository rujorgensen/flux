# .github/workflows/e2e.yml
name: Run test suites

on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - '**'
  #     - '!wip/**'

  pull_request:

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

env:
  is-main-branch: ${{ github.ref == 'refs/heads/main' }}
  is-pull-request: ${{ github.event_name == 'pull_request' }}
  sha: ${{ github.sha }}
  BUN_TEST_DISABLE_ANSI: '1'
  NX_BATCH_MODE: true
  CI: true
  FLUX_DATABASE_URL: 'redis://:non-important-dev-redis-password@localhost:1234'

jobs:
  install-deps:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

        # Temporarily skip, as pre-caching doesnt work
  #      - name: 💾 Install Bun
  #        uses: oven-sh/setup-bun@v2
  #        with:
  #          bun-version-file: package.json
  #
  #      -
  #        name: Setup bun cache
  #        id: cache-bun
  #        uses: actions/cache@v4.2.3
  #        with:
  #          path: ~/.bun/install/cache
  #          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
  #          restore-keys: |
  #            ${{ runner.os }}-bun-
  #
  #      -
  #          name: 💾 Install dependencies on cache miss
  #          if : ${{ steps.cache-bun.outputs.cache-hit != 'true' }}
  #          run: bun install --no-cache

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup bun cache
        id: cache-bun
        uses: actions/cache@v5.0.3
        with:
          # fail-on-cache-miss: true
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 💾 Install dependencies (FOR SOME REASON, READING THE CACHE IS NOT ENOUGH)
        run: bun install --no-cache

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bun nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected

      - name: 🧪 Run unit tests
        # RYUK does not work with github actions or Circle CI
        run: TESTCONTAINERS_RYUK_DISABLED=true bun nx affected -t bun-test # --no-agents
      
      - name: 🧪 Run tests
        run: bun nx affected -t test

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup bun cache
        id: cache-bun
        uses: actions/cache@v5.0.3
        with:
          # fail-on-cache-miss: true
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 💾 Install dependencies (FOR SOME REASON, READING THE CACHE IS NOT ENOUGH)
        run: bun install --no-cache

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bun nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected

      - name: 🧪 Run E2E tests
        # RYUK does not work with github actions or Circle CI
        run: TESTCONTAINERS_RYUK_DISABLED=true bun nx affected:e2e --output-style=stream --verbose --timeout=30000 # --no-agents

  build-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install-deps]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0    # 👈 Required to retrieve git history

      - uses: nrwl/nx-set-shas@v4

      - name: 💾 Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup bun cache
        id: cache-bun
        uses: actions/cache@v5.0.3
        with:
          # fail-on-cache-miss: true
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 💾 Install dependencies (FOR SOME REASON, READING THE CACHE IS NOT ENOUGH)
        run: bun install --no-cache

      - name: 🛠️ Build
        # Demo does not currently build
        run: bun nx affected -t build --exclude demo

      - name: 🎨 Lint
        run: bun nx affected -t lint
